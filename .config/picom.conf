#################################
#         Animations (forks)    #
#################################

animations = false;
animation-stiffness = 200.0;
animation-dampening = 20.0;
animation-window-mass = 1.0;
animation-clamping = false;
animation-for-open-window = "zoom";
animation-for-unmap-window = "zoom";
animation-for-transient-window = "slide-down";
animation-for-workspace-switch-in  = "slide-right";
animation-for-workspace-switch-out = "slide-left";

animation-exclude = [
  "class_g = 'i3bar'",
  "class_g = 'Polybar'",
  "window_type = 'dock'",
  "class_g = 'flameshot'",
  "class_g = 'xfce4-screenshooter'"
];

#################################
#             Shadows           #
#################################

shadow = true;
shadow-radius = 15;
shadow-opacity = 0.40;
shadow-offset-x = -13;
shadow-offset-y = -13;

#################################
#             Fading            #
#################################

fading = true;
fade-in-step  = 0.013;
fade-out-step = 0.013;
no-fading-openclose = true;

#################################
#     Transparency / Opacity    #
#################################

active-opacity = 0.89;
inactive-opacity = 0.89;
frame-opacity = .0;             # <<< prevent square frame showing at rounded corners
inactive-opacity-override = true;
inactive-dim = 0.0;

focus-exclude = [
  "class_g = 'Cairo-clock'",
  "class_g = 'Tomato'"
];

opacity-rule = [
  "89:class_g     = 'Polybar'",
  "89:class_g     = 'Dunst'",
  "100:class_g	  = 'Google-chrome'",
  "100:class_g	  = 'Gimp'"
];

#################################
#            Corners            #
#################################

corner-radius = 7;

# round everything except desktops/docks
rounded-corners-exclude = [
  "window_type = 'desktop'",
#  "window_type = 'dock'"
];

#################################
#              Blur             #
#################################

backend = "glx";
vsync = true;

# GLX tweaks for cleaner masks/edges
glx-no-stencil = true;
glx-no-rebind-pixmap = true;

blur-method = "dual_kawase";
blur-strength = 2;
blur-background = true;
blur-background-frame = false;     # blur follows rounded frame
blur-background-fixed = false;
blur-kern = "3x3box";

blur-background-exclude = [
  "window_type = 'desktop'",
  "class_g = 'i3-frame'",
  "_GTK_FRAME_EXTENTS@:c",
  "_PICOM_SKIP_BLUR@:c",
  "class_g = 'xfce4-screenshooter'"
];

#################################
#        General Settings       #
#################################

dithered-present = false;
detect-rounded-corners = true;
detect-client-opacity  = true;
unredir-if-possible = false;      # <<< avoid artifacts that clip corners
detect-transient = true;
use-damage = true;

#################################
#          Window Rules         #
#################################

rules: (
  {
    match = "window_type = 'tooltip'";
    fade = false;
    shadow = true;
    opacity = 0.75;
    full-shadow = false;
  },
  {
    match = "window_type = 'dock'    || "
            "window_type = 'desktop' || "
            "_GTK_FRAME_EXTENTS@";
    blur-background = false;
  },
  {
    match = "window_type != 'dock'";
  },
  {
    match = "window_type = 'dock' || "
            "window_type = 'desktop'";
    corner-radius = 0;
  },
  {
    match = "name = 'Notification'   || "
            "class_g = 'Conky'       || "
            "class_g ?= 'Notify-osd' || "
            "class_g = 'Cairo-clock' || "
            "_GTK_FRAME_EXTENTS@";
    shadow = false;
  }
);

#################################
#            Include            #
#################################

