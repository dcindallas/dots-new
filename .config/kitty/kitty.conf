# ---------- Kitty config (clean) ----------

# Fonts
font_family Hack Nerd Font Mono
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size 9
adjust_line_height 0
adjust_column_width 0
adjust_baseline 0
font_features none

# Use CJK fallback for Japanese ranges (Hiragana, Katakana, Kanji, etc.)
# Prefer the mono variant; fall back to proportional if needed.
symbol_map U+3000-U+303F,U+3040-U+309F,U+30A0-U+30FF,U+3400-U+4DBF,U+4E00-U+9FFF,U+F900-U+FAFF,U+FF00-U+FFEF Noto Sans Mono CJK JP
symbol_map U+3000-U+303F,U+3040-U+309F,U+30A0-U+30FF,U+3400-U+4DBF,U+4E00-U+9FFF,U+F900-U+FAFF,U+FF00-U+FFEF Noto Sans CJK JP

# Cursor
cursor_shape beam
cursor_beam_thickness 1.5
cursor_blink_interval 3
cursor_stop_blinking_after 20.0
cursor_trail 2

# Scrolling / mouse
scrollback_lines 12000
wheel_scroll_multiplier 3.0
wheel_scroll_min_lines 1
mouse_hide_wait -1.0
focus_follows_mouse no

# URLs / selection
detect_urls yes
url_color #fe8019
url_style dotted
open_url_with default
url_prefixes file ftp ftps gemini git gopher http https irc ircs kitty mailto news sftp ssh
copy_on_select yes
strip_trailing_spaces smart
select_by_word_characters @-./_~?&=%+#

# Rendering / sync
sync_to_monitor yes
enable_audio_bell yes
visual_bell_duration 0.0
visual_bell_color none
window_alert_on_bell yes
bell_on_tab "U+26A0"
color_depth 24

# Window/borders/margins
enabled_layouts *
window_border_width 1px
draw_minimal_borders yes
window_margin_width 2
single_window_margin_width -1
window_padding_width 5
placement_strategy center
hide_window_decorations yes

# Tabs
tab_bar_edge top
tab_bar_style hidden
tab_bar_align left
tab_bar_min_tabs 2
tab_switch_strategy previous
tab_separator " ┇"
tab_powerline_style round

# Background opacity (kitty’s own alpha for its background only)
# Final translucency still depends on your compositor settings.
background_opacity 1.0

# Start flavours
# Base16 Base16 Twilight (Restored) - kitty color config
# Scheme by From original Base16 Twilight
background #25292a
foreground #fefef9
selection_background #fefef9
selection_foreground #25292a
url_color #838184
cursor #fefef9
active_border_color #5f5a60
inactive_border_color #323537
active_tab_background #25292a
active_tab_foreground #fefef9
inactive_tab_background #323537
inactive_tab_foreground #838184
tab_bar_background #323537

# normal
color0 #25292a
color1 #cf6a4c
color2 #8f9d6a
color3 #d5d0a1
color4 #7587a6
color5 #9b859d
color6 #7cada2
color7 #fefef9

# bright
color8 #5f5a60
color9 #cf6a4c
color10 #8f9d6a
color11 #d5d0a1
color12 #7587a6
color13 #9b859d
color14 #7cada2
color15 #ffffff

# extended base16 colors
color16 #f6b26b
color17 #a06d3c
color18 #323537
color19 #464b50
color20 #838184
color21 #a7a7a7
# End flavours

# Shell/editor integration (kept minimal)
editor nano
shell_integration enabled
linux_display_server auto
kitty_mod ctrl+shift

# Key bindings (trimmed to essentials)
map kitty_mod+enter new_window
map kitty_mod+w     close_window
map kitty_mod+]     next_window
map kitty_mod+[     previous_window
map ctrl+shift+right next_tab
map ctrl+shift+left  previous_tab
map kitty_mod+l     next_layout
map ctrl+shift+f5   load_config_file
