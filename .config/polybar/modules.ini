[bar]

[module/space]
type = custom/text
content = "        "
content-background = ${color.background}
content-foreground = ${color.base03}
format-content-padding = 5
content-font = 5

[module/now]
type = custom/text
content = ""
;content-background = ${color.background}
content-foreground = ${color.base03}
format-content-padding = 0
content-font = 5

[module/power]
type = custom/text
content = ""
content-background = ${color.background}
content-foreground = ${color.base09}
format-content-padding = 0
content-font = 3
click-left = exec rofi -show power-menu -theme /home/duane/.config/rofi/style-power.rasi -modi power-menu:rofi-power-menu -width 300

[module/music]
type = custom/script
exec = ~/.config/polybar/scripts/now-playing.sh
tail = true
content-background = ${color.background}
label-foreground = ${color.base0D}
format-content-padding = 0
content-font = 3
label-font = 3
;label-minlen = 20
;label-maxlen = 20
label-alignment = left

[module/updates]
type = custom/script
exec = ~/.config/polybar/scripts/updates.sh
tail = true

format = <label>
format-prefix = ""
label = "%output% "
label-padding = 0

format-prefix-font = 5
label-font = 0
label-alignment = center
label-foreground = ${color.foreground}
format-prefix-foreground = ${color.base0C}

click-left = exec kitty -e sudo pacman -Syyuu

[module/date]
type = internal/date
interval = 1.0
date = %a, %b %e
time = %I:%M%p
date-alt = Its %A, %d %B %Y
time-alt = at %k:%M:%S
format = <label>
format-prefix = ""
format-prefix-font = 3
label = "%date%"
label-padding = 3
label-font = 0
label-alignment = center
format-prefix-foreground = ${color.base0D}
label-foreground = ${color.foreground}
format-prefix-padding = 0

[module/time]
type = internal/date
interval = 1.0
date = %A, %B %e
time = %I:%M%P
date-alt = Its %A, %d %B %Y
time-alt = %k:%M:%S
format = <label>
format-prefix = ""
format-prefix-font = 3
label = "%time%"
label-padding = 3
label-font = 0
label-alignment = center
format-prefix-foreground = ${color.base07}
format-prefix-padding = 0
label-foreground = ${color.foreground}

[module/temp]
type = custom/script
exec = /home/duane/.config/polybar/scripts/condition.sh
interval = 600  # every 10 min
label-font = 0
label-foreground = ${color.foreground}
label-minlen = 20
label-maxlen = 20
click-left = ~/.config/polybar/scripts/weather_menu.sh
label-padding = 2

[module/icon]
type = custom/script
exec = /home/duane/.config/polybar/scripts/weather.sh
interval = 600  # every 10 min
label-font = 4
click-left = ~/.config/polybar/scripts/weather_menu.sh
; label-foreground = ${color.base0B}
label-padding = 2

[module/temps]
type = custom/script
exec = ~/.config/polybar/scripts/temps.sh
interval = 5
label = %output%
format-prefix = ""
format-prefix-font = 3
format-prefix-foreground = ${color.foreground}
label-foreground = ${color.foreground}
label-padding = 0


[module/root]
type = internal/fs
mount-0 = /
interval = 30
fixed-values = true
label-mounted-minlen = 13
label-mounted-maxlen = 13
label-mounted-ellipsis = false
format-mounted = <label-mounted>
format-mounted-prefix = "HDD "
format-mounted-prefix-font = 0
format-mounted-prefix-foreground = ${color.base09}
format-unmounted = <label-unmounted>
format-unmounted-prefix = ""
format-unmounted-prefix-foreground = ${color.base0E}
label-mounted = "%free%"
label-unmounted = " %mountpoint%: NA"
left-click = exec nautilus &
label-mounted-padding = 0
format-mounted-prefix-padding = 0
format-unmounted-prefix-padding = 0
label-mounted-alignment = left
label-mounted-foreground = ${color.base04}
label-mounted-font = 0
label-unmounted-font = 0

[module/cpu]
type = internal/cpu
interval = 1
format = <label>
label = "%percentage%%"
label-font = 0
label-padding = 0
;label-minlen = 6
;label-maxlen = 6
format-prefix-font = 0
format-prefix = "CPU "
format-prefix-foreground = ${color.base0E}
format-prefix-padding = 0
label-ellipsis = false
label-alignment = left
label-foreground = ${color.base04}

[module/memory]
type = internal/memory
interval = 1
format-mem = <label>
format-prefix = "MEM "
format-prefix-font = 0
label = "%gb_free%"
label-padding = 0
label-minlen = 16
label-maxlen = 16
label-font = 0
format-prefix-padding = 0
label-ellipsis = false
label-alignment = left
format-prefix-foreground = ${color.base0C}
label-foreground = ${color.base04}

[module/title]
type = internal/xwindow
format = <label>
format-background = ${color.background}
format-foreground = ${color.foreground}
format-padding = 4
label = %title%
label-maxlen = 50
label-empty = Empty
label-empty-foreground = ${color.foreground}

[module/playerctl]
type = custom/script
exec = /home/duane/.config/polybar/scripts/play-pause.sh
label-alignment = center
interval = 0.5
format-padding = 4
content-font = 5
format-foreground = ${color.base07}
click-left = playerctl -a play-pause

[module/prev]
type = custom/text
content = "󰒮"
click-left = playerctl next
content-font = 5
content-foreground = ${color.base04}
content-padding = 2

[module/next]
type = custom/text
content = "󰒭 "
click-left = playerctl next
content-font = 5
content-foreground = ${color.base04}
content-padding = 2

[module/scroll]
type = custom/script
tail = true
interval = .5                ; ignored when tail=true, but fine
format = <label>
exec = ~/.config/polybar/scripts/scroll_spotify_status.sh
label-maxlen = 30
label-minlen = 30
label-ellipsis = false
label-font = 0
label-padding = 0
format-foreground = ${color.foreground}
format-prefix = ""
format-prefix-foreground = ${color.base04}
; label-alignment is ignored for custom/script, so you can drop it or leave it—no effect

[module/song]
type = custom/script

; Only enable this module when something is actively playing
exec-if = playerctl status 2>/dev/null | grep -qi 'playing'

; When enabled, print "Title – Artist"
exec = playerctl metadata --format "{{ title }} – {{ artist }}" 2>/dev/null
interval = 2

format = <label>
label = %output%
label-padding = 0
label-font = 0

; styling
format-foreground = ${color.foreground}
format-prefix = 
format-prefix-foreground = ${color.base04}

[module/ewmh]
type = internal/xworkspaces
pin-workspaces = true
group-by-monitor = false
enable-click = true
enable-scroll = true
reverse-scroll = true

; Workspace → icon mapping (used for EMPTY/URGENT states below)
icon-0 = 1;
icon-1 = 2;
icon-2 = 3;
icon-3 = 4;
icon-4 = 5;
icon-5 = 6;
icon-default = 

; Show per-state labels only
format = <label-state>

; FOCUSED workspace (active)
label-active = 
label-active-foreground = ${color.base0A}
;label-active-background = ${color.background}
label-active-padding = 2
; If your bullet needs a specific font index, uncomment:
;label-active-font = 5

; OCCUPIED (non-focused but has windows)
label-occupied = 
label-occupied-foreground = ${color.base04}
;label-occupied-background = ${color.background}
label-occupied-padding = 2
;label-occupied-font = 5

; URGENT keeps the mapped icon, just different color
label-urgent = %icon%
label-urgent-foreground = ${color.base07}
;label-urgent-background = ${color.background}
label-urgent-padding = 2

; EMPTY uses your mapped icons
label-empty = %icon%
label-empty-foreground = ${color.base0E}
label-empty-padding = 2
;label-empty-font = 5

[module/bluetooth]
type = custom/script
exec = ~/.config/polybar/scripts/bt_status.sh
interval = 5
format = <label>
label = %output%
format-padding = 1
content-font = 3
; left click → launch blueman-applet
click-left = blueman &

; right click → rofi-bluetooth (styled w/ your bluetooth-menu.rasi)
click-right = rofi-bluetooth

[module/volume]
type = internal/pulseaudio
content-font = 3

format-volume = <ramp-volume>
format-muted  = <label-muted>

ramp-volume-0 = 󰕿
ramp-volume-1 = 󰖀
ramp-volume-2 = 󰕾

; colors (your flavours vars)
ramp-volume-0-foreground = ${color.base09}
ramp-volume-1-foreground = ${color.base0A}
ramp-volume-2-foreground = ${color.base08}

; 🔇 muted icon + grey color
label-muted = 󰖁
label-muted-foreground = ${color.base04}

interval    = 1
scroll-step = 5

click-left  = pactl set-sink-mute @DEFAULT_SINK@ toggle
scroll-up   = pactl set-sink-volume @DEFAULT_SINK@ +5%
scroll-down = pactl set-sink-volume @DEFAULT_SINK@ -5%

[module/wifi]
type = custom/script
exec = ~/.config/polybar/scripts/wifi_status.sh
interval = 3
format = <label>
label = %output%
content-font = 3
; left click → GUI editor (fallbacks if not found)
click-left = ~/.config/polybar/scripts/wifi_launch_left.sh

; right click → your rofi wifi menu (the wrapper applies the theme)
click-right = ~/.local/bin/rofi-wifi

[module/kdeconnect]
type = custom/script
exec = ~/.local/bin/polybar-kdeconnect.sh -d
interval = 5
label = %output%
format-padding = 2
; no click bindings here — the script embeds clickable areas with %{A...}
